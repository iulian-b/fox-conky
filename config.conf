-- GPU: use the DRM card with the most VRAM (the discrete GPU on iGPU+dGPU systems); 
-- @CARD@ in the text below is replaced with it (ex. card1)
local gpu_card, gpu_vram = 'card0', -1
for i = 0, 15 do
	local f = io.open('/sys/class/drm/card' .. i .. '/device/mem_info_vram_total')
	if f then
		local vram = f:read('n') or 0
		f:close()
		if vram > gpu_vram then gpu_card, gpu_vram = 'card' .. i, vram end
	end
end

